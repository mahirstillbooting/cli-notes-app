<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLI Notes | Profile</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="page-shell">

    <header class="top-terminal-bar">
      <div class="logo-wrap">
        <img src="img/debooging.png" alt="App Logo" class="logo-img" />

        <div class="logo-text">
          <div class="app-title">CLI Notes</div>
          <div class="app-subtitle">profile / account settings</div>
        </div>
      </div>

      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <button type="button" class="btn" onclick="logoutUser()">Logout</button>
    </header>

    <nav class="breadcrumb">
      home / dashboard / <span>profile</span>
    </nav>

    <section class="auth-layout">
      <div class="auth-card">

        <div class="terminal-label">~/user/profile</div>

        <h1 class="auth-title">Profile</h1>

        <p class="auth-text">
          Update your display name. This name will be saved to your user profile.
        </p>

        <form id="profileForm">
          <div class="form-group">
            <label for="profileName">Full Name</label>
            <input
              type="text"
              id="profileName"
              class="form-control"
              placeholder="Your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="profileEmail">Email</label>
            <input
              type="email"
              id="profileEmail"
              class="form-control"
              readonly
            />
          </div>

          <div class="btn-row">
            <button type="submit" class="btn btn-primary">Save Profile</button>
            <a href="dashboard.html" class="btn">Back</a>
          </div>

          <p id="profileStatus" class="status-message"></p>
        </form>

      </div>
    </section>

  </main>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
