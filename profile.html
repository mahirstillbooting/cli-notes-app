<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLI Notes | Profile</title>
  <link rel="icon" type="image/png" href="img/logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
  />
  <script>
    (function () {
      if (sessionStorage.getItem("cli-notes-logged-out") === "1") {
        document.documentElement.style.visibility = "hidden";
        window.location.replace("index.html");
        return;
      }
      var saved = localStorage.getItem("cli-notes-theme");
      var theme = saved === "dark" || saved === "light"
        ? saved
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="page-shell">

    <header class="topbar">
      <a href="dashboard.html" class="brand-link">
        <img src="img/logo-mark.png" alt="CLI Notes logo" class="brand-mark" width="38" height="38" />
        <span class="brand-meta">
          <span class="brand-title">CLI_NOTES</span>
          <span class="brand-path">~/user/profile</span>
        </span>
      </a>

      <div class="topbar-controls">
        <nav class="nav-group" aria-label="Main navigation">
          <a href="dashboard.html" class="nav-pill">Notes</a>
          <a href="profile.html" class="nav-pill is-active" aria-current="page">Profile</a>
        </nav>

        <button type="button" class="theme-btn" data-theme-toggle aria-label="Toggle color theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span class="theme-btn-label">DARK</span>
        </button>

        <button type="button" class="btn btn-exit" onclick="logoutUser()" aria-label="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Exit</span>
        </button>
      </div>
    </header>

    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="dashboard.html">~/notes</a>
      <span>/</span>
      <span class="crumb-current">profile</span>
    </nav>

    <section class="auth-stage">
      <div class="brutal-card">
        <h1 class="card-heading">Account Profile</h1>
        <p class="card-lead">
          Update the display name linked to your Firebase account.
        </p>

        <div id="profileSkeleton" class="skeleton-editor" style="margin-bottom: 16px;" hidden aria-hidden="true">
          <div class="skeleton-block skeleton-title" style="width: 55%;"></div>
          <div class="skeleton-block skeleton-line" style="width: 80%;"></div>
        </div>

        <div id="profileBanner" class="profile-banner">
          <div id="profileAvatar" class="profile-avatar" aria-hidden="true">U</div>
          <div class="profile-banner-meta">
            <div id="profileBannerName" class="profile-banner-name">Signed-in user</div>
            <div id="profileBannerEmail" class="profile-banner-email">Loading account...</div>
          </div>
        </div>

        <form id="profileForm">
          <div class="form-group">
            <label for="profileName">Full Name</label>
            <input
              type="text"
              id="profileName"
              class="form-control"
              placeholder="Your name"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="profileEmail">Email</label>
            <input
              type="email"
              id="profileEmail"
              class="form-control"
              readonly
            />
          </div>

          <div class="btn-row">
            <button type="submit" class="btn btn-primary">Save Profile</button>
            <a href="dashboard.html" class="btn">Back</a>
          </div>

          <p id="profileStatus" class="status-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

  </main>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
