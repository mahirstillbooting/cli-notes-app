<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLI Notes | Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="page-shell">

    <header class="top-terminal-bar">
      <div class="logo-wrap">
        <img src="img/debooging.png" alt="App Logo" class="logo-img" />

        <div class="logo-text">
          <div class="app-title">CLI Notes</div>
          <div class="app-subtitle">terminal-style cloud note system</div>
        </div>
      </div>

      <a href="index.html" class="nav-link">Login</a>
      <a href="signup.html" class="nav-link">Signup</a>
    </header>

    <section class="auth-layout">
      <div class="auth-card">

        <div class="terminal-label">~/auth/login</div>

        <h1 class="auth-title">Welcome back.</h1>

        <p class="auth-text">
          Sign in to access your private cloud notes. Your notes will stay linked
          to your own account only.
        </p>

        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input
              type="email"
              id="loginEmail"
              class="form-control"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input
              type="password"
              id="loginPassword"
              class="form-control"
              placeholder="Enter password"
              required
            />
          </div>

          <div class="btn-row">
            <button type="submit" class="btn btn-primary">Sign In</button>
            <button type="button" id="googleLoginBtn" class="btn btn-google">
              Continue with Google
            </button>
          </div>

          <p id="loginStatus" class="status-message"></p>
        </form>

        <p class="mini-note">
          New here?
          <a href="signup.html">Create an account</a>
        </p>

      </div>
    </section>

  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
