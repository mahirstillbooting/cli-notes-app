<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLI Notes | Login</title>
  <link rel="icon" type="image/png" href="img/logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
  />
  <script>
    (function () {
      var saved = localStorage.getItem("cli-notes-theme");
      var theme = saved === "dark" || saved === "light"
        ? saved
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="page-shell">

    <header class="topbar">
      <a href="index.html" class="brand-link">
        <img src="img/logo-mark.png" alt="CLI Notes logo" class="brand-mark" width="38" height="38" />
        <span class="brand-meta">
          <span class="brand-title">CLI_NOTES</span>
          <span class="brand-path">~/auth/login</span>
        </span>
      </a>

      <div class="topbar-controls">
        <nav class="nav-group" aria-label="Authentication navigation">
          <a href="index.html" class="nav-pill is-active" aria-current="page">Login</a>
          <a href="signup.html" class="nav-pill">Signup</a>
        </nav>

        <button type="button" class="theme-btn" data-theme-toggle aria-label="Toggle color theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span class="theme-btn-label">DARK</span>
        </button>
      </div>
    </header>

    <section class="auth-stage">
      <div class="brutal-card">
        <h1 class="card-heading">Sign in to your notes.</h1>
        <p class="card-lead">
          Access your private cloud workspace synced to your account.
        </p>

        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input
              type="email"
              id="loginEmail"
              class="form-control"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="password-wrap">
              <input
                type="password"
                id="loginPassword"
                class="form-control"
                placeholder="Enter password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="pw-toggle"
                data-pw-toggle="loginPassword"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary full-width">Sign In</button>

          <div class="divider-line">or</div>

          <button type="button" id="googleLoginBtn" class="btn btn-google full-width">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21.35 11.1H12v3.2h5.35c-.45 2.3-2.45 3.7-5.35 3.7a6 6 0 1 1 0-12c1.6 0 3 .6 4.05 1.55l2.3-2.3A9.2 9.2 0 1 0 12 21.2c5.3 0 9.4-3.7 9.4-9.1 0-.35-.02-.68-.05-1z"></path>
            </svg>
            Continue with Google
          </button>

          <p id="loginStatus" class="status-message" role="status" aria-live="polite"></p>
        </form>

        <p class="mini-note">
          New here?
          <a href="signup.html">Create an account</a>
        </p>
      </div>
    </section>

  </main>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
