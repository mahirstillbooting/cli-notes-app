<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLI Notes | Signup</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="page-shell">

    <header class="top-terminal-bar">
      <div class="logo-wrap">
        <img src="img/debooging.png" alt="App Logo" class="logo-img" />

        <div class="logo-text">
          <div class="app-title">CLI Notes</div>
          <div class="app-subtitle">terminal-style cloud note system</div>
        </div>
      </div>

      <a href="index.html" class="nav-link">Login</a>
      <a href="signup.html" class="nav-link">Signup</a>
    </header>

    <section class="auth-layout">
      <div class="auth-card">

        <div class="terminal-label">~/auth/signup</div>

        <h1 class="auth-title">Create your account.</h1>

        <p class="auth-text">
          First continue with Google. Your full name and email will be taken from
          your Google account. Then set a password for email/password login.
        </p>

        <div class="btn-row">
          <button type="button" id="googleSignupBtn" class="btn btn-google full-width">
            Continue with Google
          </button>
        </div>

        <form id="signupForm">
          <div class="form-group">
            <label for="signupName">Full Name</label>
            <input
              type="text"
              id="signupName"
              class="form-control"
              placeholder="Taken from Google"
              required
            />
          </div>

          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input
              type="email"
              id="signupEmail"
              class="form-control"
              placeholder="Taken from Google"
              required
              readonly
            />
          </div>

          <div class="form-group">
            <label for="signupPassword">Set Password</label>
           <input
  type="password"
  id="signupPassword"
  class="form-control"
  placeholder="Minimum 6 characters"
  autocomplete="new-password"
  required
/>
          </div>

          <div class="btn-row">
            <button type="submit" class="btn btn-primary">Finish Signup</button>
          </div>

          <p id="signupStatus" class="status-message"></p>
        </form>

        <p class="mini-note">
          Already have an account?
          <a href="index.html">Sign in</a>
        </p>

      </div>
    </section>

  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
