<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLI Notes | Note</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="page-shell">

    <header class="top-terminal-bar">
      <div class="logo-wrap">
        <img src="img/debooging.png" alt="App Logo" class="logo-img" />

        <div class="logo-text">
          <div class="app-title">CLI Notes</div>
          <div class="app-subtitle">write / save / download</div>
        </div>
      </div>

      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <button type="button" class="btn" onclick="logoutUser()">Logout</button>
    </header>

    <nav class="breadcrumb">
      home / dashboard / <span>note</span>
    </nav>

    <section class="dashboard-header">
      <div>
        <div class="terminal-label" id="noteModeLabel">~/notes/editor</div>
        <h1 class="auth-title">Note Editor</h1>
      </div>

      <div class="btn-row">
        <a href="dashboard.html" class="btn">Back</a>
        <button type="button" id="downloadNoteBtn" class="btn">Download .txt</button>
        <button type="button" id="saveNoteBtn" class="btn btn-primary">Save</button>
      </div>
    </section>

    <section class="panel note-editor-panel">

      <div class="form-group">
        <label for="noteTitle">Title</label>
        <input
          type="text"
          id="noteTitle"
          class="form-control"
          placeholder="Untitled Note"
        />
      </div>

      <div class="form-group">
        <label for="noteContent">Write</label>
        <textarea
          id="noteContent"
          class="form-control note-textarea"
          placeholder="Start typing..."
        ></textarea>
      </div>

      <p id="noteStatus" class="status-message"></p>

    </section>

  </main>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/note.js"></script>
</body>
</html>
